version: 1.0.0
ishareConfig:
  middlewareConfig:
    type: satellite
    mode: "<ENVIRONMENT>"
    blockchain_middleware_url: "http://ishare_hlf:21001/api"
    explorerDb: postgresql://hppoc:password@explorerdb:5432/fabricexplorer?sslmode=disable
    offchainDb: postgresql://postgres:postgres@offchain_sat:5432/offchaindata?sslmode=disable 
#STARTS Scheduler Configuration to send Email Notifications for Network status and push the updates to the keycloak  
    emailID: "<SMTP_USER>"
    emailSecret: "<SMTP_PASSWORD>"
    emailPort: "<SMTP_PORT>"
    emailHost: "<SMTP_HOST>"
    displayName: "<DISPLAY_NAME>"
    emailForceUpdate: false
    # If the emailForceUpdate values are true, then the middleware application will update the above email setup in the keycloak. (restart the ishare middleware service once the changes are incorporated)
#Sceduler Configuration to send Email Notifications for Network status ENDS    
    blockchain_details:
      admin: Admin
      channel_id: <CHANNEL_NAME>
      chaincode_id: <CHAINCODE_NAME>
      msp_id: <orgName>
      orgName: <orgName>
    forgotPasswordLink: "https://<UIHostName>/account/reset-password"
    partyId: <PartyId>
    # Cross-satellite user endpoints (PR-MW !25-!33). The jwtRSA256 pair the installer mounts is this
    # registry's registered certificate; it signs the peer calls this box makes. The enforcement
    # switches render from ENFORCE_M2M_AUTH / REQUIRE_M2M_AUDIENCE / ENFORCE_RBAC / RBAC_AUDIT_ONLY
    # (default off on a satellite: the old UI's revoke page still reads a satellite's users without a bearer).
    enforceM2MAuth: <ENFORCE_M2M_AUTH>
    requireM2MAudience: <REQUIRE_M2M_AUDIENCE>
    m2mSigningCertPath: /home/appuser/ishare-middleware/jwtRSA256-public.pem
    m2mSigningKeyPath: /home/appuser/ishare-middleware/jwtRSA256-private.pem
    enforceRBAC: <ENFORCE_RBAC>
    rbacAuditOnly: <RBAC_AUDIT_ONLY>
    partyName: <PartyName>
  platformURL: ""
  keyCloakConfig:
    domain: <KEYCLOAK_INTERNAL_URL>
    clientId: frontend
    clientSecret: ""
    adminId: <KEYCLOAK_ADMIN_USER>
    adminSecret: "<KEYCLOAK_ADMIN_PASSWORD>"
    adminRealmName: master
    realmName: <orgName>
  versionConfig:
    currentVersion: 1.0
  cookieInfo:
    secrets:
      - super-secret-key-explorer-<orgName>
    cookieName: cookie-name-explorer-<orgName>
  listenAddr: ":21001"
  sslConfig:
    enable: false
    sslCertPath: ""
    sslKeyPath: ""
