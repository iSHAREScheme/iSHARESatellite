version: "3.7"

networks:
  net:
    name: fabric_network

volumes:
  keycloakpostgres_data:
    name: keycloak_keycloakpostgres_data

services:
  keycloak:
    image: <KEYCLOAK_IMAGE>
    container_name: keycloak
    ports:
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY_HEADERS=xforwarded
      - KC_PROXY=edge
      - QUARKUS_HTTP_HTTP2=false
      - KC_DB=postgres
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_DB_URL_HOST=keycloakpostgres
      - KC_DB_URL=jdbc:postgresql://keycloakpostgres/keycloak
      - KC_HOSTNAME=<KEY_CLOAK_HOST_NAME>
      - KC_HOSTNAME_ADMIN_URL=https://<KEY_CLOAK_HOST_NAME>/auth/
      - KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI=true
    volumes:
      - ./realm-test.json:/opt/keycloak/data/import/realm-test.json
    command:
      - start --import-realm
    restart: always
    depends_on:
      - keycloakpostgres
    networks:
    - net

  keycloakpostgres:
    image: <POSTGRES_IMAGE>
    container_name: keycloakpostgres
    ports:
      - 1432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    restart: always
    volumes:
      - keycloakpostgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d
    networks:
    - net
